<!doctype html><html lang=de><head><meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AD%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Privates Karriere-Dashboard.">
<title>Astro Career Scout</title>
<style>
 :root{color-scheme:dark}
 *{box-sizing:border-box}
 body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#0f1115;color:#e6e6e6}
 header{padding:14px 20px;background:#171a21;border-bottom:1px solid #262b36;position:sticky;top:0;z-index:6}
 h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 a{color:#5ec8f0;text-decoration:none} a:hover{text-decoration:underline}
 .meta{color:#8b93a7;font-size:12px;margin-top:5px}
 .goal{color:#7f8aa3;font-size:11.5px;margin-top:3px}
 .panels{padding:12px 0 0;display:grid;gap:10px;grid-template-columns:1fr 1fr}
 @media(max-width:720px){.panels{grid-template-columns:1fr}}
 .panel{background:#141b26;border:1px solid #26303f;border-left:3px solid #3b6ea5;border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.5}
 .panel.port{border-left-color:#8b5cf6}
 .panel b{color:#eaf0fb}
 .panel .chip{display:inline-block;background:#1e2733;border:1px solid #2b3646;border-radius:6px;padding:1px 7px;margin:2px 4px 0 0;color:#c7d2e0;font-size:11.5px}
 .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:#12151b;border-bottom:1px solid #262b36;position:sticky;top:59px;z-index:5}
 .controls input,.controls select{background:#1b2029;color:#e6e6e6;border:1px solid #2b3140;border-radius:8px;padding:7px 10px;font-size:13px}
 .persons{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
 .pbtn{background:#1b2029;color:#9aa7b4;border:1px solid #2b3140;border-radius:999px;padding:7px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
 .pbtn:hover{border-color:#3a4255;color:#d7dceb}
 .pbtn.on{background:#1d3a63;border-color:#4f8cff;color:#dce9ff}
 .multi{position:relative;display:inline-block}
 .multibtn{background:#1b2029;color:#e6e6e6;border:1px solid #2b3140;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;font-family:inherit}
 .multibtn:hover{border-color:#3a4255}
 .multibtn.on{border-color:#4f8cff;color:#bcd6ff}
 .multimenu{position:absolute;top:calc(100% + 5px);left:0;z-index:30;background:#161b24;border:1px solid #2b3140;border-radius:10px;padding:8px;min-width:200px;box-shadow:0 12px 28px rgba(0,0,0,.55)}
 .multimenu label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;color:#e6e6e6}
 .multimenu label:hover{background:#1e2531}
 .multiclear{width:100%;margin-top:7px;background:#232a36;color:#c3ccdd;border:1px solid #2b3140;border-radius:7px;padding:6px;font-size:12px;cursor:pointer;font-family:inherit}
 .multiclear:hover{background:#2a3340}
 .muted{color:#8b93a7;font-size:12px}
 .list{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:14px}
 .card{background:#171a21;border:1px solid #262b36;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px}
 .card.new{border-color:#2b5e3a;box-shadow:0 0 0 1px #1c8f4522}
 .card.must{border-left:4px solid #22c55e}
 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
 .badge{font-weight:700;padding:3px 9px;border-radius:999px;font-size:13px;color:#fff;flex:0 0 auto}
 .title{font-size:16px;font-weight:700;line-height:1.25}
 .emp{color:#c3ccdd;font-size:13px}
 .tier{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-bottom:2px;display:inline-block}
 .tier.must{background:#14532d;color:#a7f3c2} .tier.int{background:#5a4a12;color:#fde68a} .tier.back{background:#333b48;color:#c3ccdd}
 .status{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:3px}
 .status.st-ver{background:#0f3d24;color:#7ee0af;border:1px solid #1c8f45}
 .status.st-prog{background:#0f2f47;color:#8fd0ff;border:1px solid #2b6ea5}
 .status.st-init{background:#3a2a12;color:#ffcf8a;border:1px solid #7a5a1a}
 .status.st-src{background:#2a2f3a;color:#aab6c8;border:1px solid #3a4556}
 .tag{display:inline-block;background:#23314a;color:#9cc4ff;border-radius:6px;padding:1px 8px;font-size:11px;margin:2px 4px 0 0}
 .tag.reg{background:#2a2440;color:#c3aaff}
 .tag.new{background:#3ddc84;color:#07230f;font-weight:700}
 .tag.pay{background:#14352a;color:#7ee0af}
 .tag.dl{background:#3a1f24;color:#ffb3bd}
 .tag.init{background:#3a2a12;color:#ffcf8a}
 .why{font-size:13.5px;color:#d7dceb;line-height:1.4}
 .skills{font-size:11.5px;color:#8b93a7}
 .btns{display:flex;gap:8px;margin-top:4px}
 .btn{flex:1;text-align:center;background:#2563eb;color:#fff;border-radius:8px;padding:8px;font-size:13px}
 .empty{padding:44px;text-align:center;color:#8b93a7;grid-column:1/-1;line-height:1.6}
 .hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
 .hrow h1{flex:0 0 auto}
 .hrow .persons{margin:0;flex:1 1 auto;justify-content:center}
 .briefbtn{background:#1b2029;color:#9aa7b4;border:1px solid #2b3140;border-radius:8px;padding:6px 12px;
           font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
 .briefbtn:hover{color:#e6e6e6;border-color:#3b475c}
 .briefbtn.on{background:#233043;color:#cfe0f5;border-color:#3b5a80}
 #brief{padding:12px 20px 4px;border-bottom:1px solid #262b36;background:#101319}
 .summary{color:#c7d2e0;font-size:12.5px;line-height:1.55;background:#141b26;border:1px solid #26303f;
          border-left:3px solid #d9a441;border-radius:10px;padding:10px 13px}
 .summary b{color:#eaf0fb}
 .why.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
 .more{color:#5ec8f0;font-size:12px;cursor:pointer;display:inline-block;margin-top:2px;
       background:none;border:0;padding:0;font-family:inherit}
 .more:hover{text-decoration:underline}
 .jbtns{display:flex;gap:6px;margin-top:7px}
 .jb{flex:1;background:#1b2029;color:#8b93a7;border:1px solid #2b3140;border-radius:7px;padding:5px 4px;
     font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
 .jb:hover{color:#e6e6e6;border-color:#3b475c}
 .jb.on{background:#233043;color:#cfe0f5;border-color:#3b5a80;font-weight:600}
 .card.st-done{opacity:.5}
 .card.st-applied{box-shadow:inset 3px 0 0 #22c55e}
 .card.st-saved{box-shadow:inset 3px 0 0 #d9a441}
 .resetbtn{background:#233043;color:#cfe0f5;border:1px solid #3b5a80;border-radius:8px;padding:7px 14px;
           font-size:13px;cursor:pointer;font-family:inherit;margin-top:12px}
 .empty b{color:#e6e6e6}
</style></head><body>
<header>
 <div class=hrow>
   <h1 id=title>Career Scout</h1>
   <div class=persons id=persons></div>
   <button type=button id=briefbtn class=briefbtn aria-expanded=false>Lagebericht &#9662;</button>
 </div>
 <div class=meta id=meta>lädt …</div>
</header>
<div id=brief hidden>
 <div class=goal id=goal></div>
 <div class=summary id=summary></div>
 <div class=panels id=panels></div>
</div>
<div class=controls>
 <input id=q aria-label="Volltextsuche" placeholder="Suche: Arbeitgeber / Titel / Ort / Skill …" style="flex:1;min-width:170px">
 <select id=cat aria-label="Kategorie"><option value=all>Alle Kategorien</option></select>
 <select id=region aria-label="Region"><option value=all>Alle Regionen</option></select>
 <select id=work aria-label="Bearbeitungsstand">
   <option value=open>Offen (ohne erledigte)</option>
   <option value=all>Alle, auch erledigte</option>
   <option value=saved>★ Nur gemerkte</option>
   <option value=applied>✔ Nur beworbene</option>
   <option value=done>✖ Nur erledigte</option>
 </select>
 <div class=multi>
   <button type=button id=typebtn class=multibtn>Alle Arten &#9662;</button>
   <div id=typemenu class=multimenu hidden>
     <div id=typeopts></div>
     <button type=button id=typeclear class=multiclear>Auswahl zurücksetzen</button>
   </div>
  </div>
 <select id=status aria-label="Quellenstatus">
   <option value=all>Alle Status</option>
   <option value=verified>🟢 Geprüfte Ausschreibung</option>
   <option value=program>📋 Programm</option>
   <option value=initiative>✍️ Initiativbewerbung</option>
   <option value=source>🔎 Karriereseite</option>
 </select>
 <select id=tier>
   <option value=all>Alle Prioritäten</option>
   <option value=must_apply>🟢 Top-Priorität</option>
   <option value=interesting>🟡 Interessant</option>
   <option value=backup>⚪ Backup</option>
 </select>
 <label class=muted>min&nbsp;Score <input id=minscore type=number value=0 min=0 max=80 style="width:60px"></label>
 <select id=sort>
   <option value=score>Sortierung: Score</option>
   <option value=first_seen>Neueste zuerst</option>
   <option value=deadline>Frist zuerst</option>
   <option value=employer>Arbeitgeber A–Z</option>
 </select>
 <label class=muted><input type=checkbox id=onlynew> nur neue</label>
 <button type=button id=resetall class=briefbtn hidden>Filter zurücksetzen</button>
</div>
<div class=list id=list></div>
<script>
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem('jh_'+k));return v==null?d:v}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem('jh_'+k,JSON.stringify(v))}catch(e){}};
const $=id=>document.getElementById(id);
const q=$('q'),cat=$('cat'),region=$('region'),status=$('status'),tier=$('tier'),ms=$('minscore'),so=$('sort'),onlynew=$('onlynew');
const typeBtn=$('typebtn'),typeMenu=$('typemenu');
let typeSel=(function(){const v=L('types',null);if(Array.isArray(v))return v;const o=L('type','all');return(o&&o!=='all')?[o]:[];})();
q.value=L('q','');cat.value=L('cat','all');region.value=L('region','all');
status.value=L('status','all');tier.value=L('tier','all');ms.value=L('minscore',0);so.value=L('sort','score');onlynew.checked=L('onlynew',false);
let ALL=[];let DATA={};
const work=$('work');work.value=L('work','open');
let JOBST=(function(){const v=L('jobstate',null);return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};})();
const ISO=new Date().toISOString().slice(0,10);
let lastVisit=L('lastvisit',null);
let NEWSINCE='';
function keyOf(d){return d.id||d.url||'';}
function jstate(d){return JOBST[keyOf(d)]||'';}
function setState(k,v){
  if(JOBST[k]===v)delete JOBST[k];else JOBST[k]=v;
  SV('jobstate',JOBST);meta();render();
}
function newestFor(p){return ALL.reduce((m,d)=>{if((d.person||'oliver')!==p)return m;const f=''+(d.first_seen||'');return f>m?f:m},'');}
function isNew(d){const n=newestFor(d.person||'oliver');return n?((''+(d.first_seen||''))>=n):!!d.is_new;}
let person=L('person','oliver');
const TITLES={oliver:'🔭 Astro Career Scout <span class=muted style="font-weight:400">Astronomie · Space · Informatik</span>',
              leonard:'💼 Career Scout Leonard <span class=muted style="font-weight:400">KI · Data · Digitalisierung</span>'};
function esc(s){return (''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tierOf(d){if(d.tier)return d.tier;const s=+d.score||0;return s>=55?'must_apply':s>=40?'interesting':'backup';}
function tierMeta(t){return t==='must_apply'?['🟢 Top-Priorität','must']:t==='interesting'?['🟡 Interessant','int']:['⚪ Backup','back'];}
function statusOf(d){if(d.status)return d.status;return d.init_application?'initiative':'source';}
function statusMeta(s){return s==='verified'?['🟢 Geprüfte Ausschreibung','st-ver','Zur Ausschreibung →']
  :s==='program'?['📋 Programm – Bewerbungsfenster prüfen','st-prog','Zum Programm →']
  :s==='initiative'?['✍️ Initiativbewerbung (keine offene Stelle)','st-init','Kontakt / Karriereseite →']
  :['🔎 Karriereseite – bitte selbst nach aktueller Ausschreibung schauen','st-src','Karriereseite öffnen →'];}
function label(s){s=+s||0;if(s>=55)return['🔥','#166534'];if(s>=40)return['✅','#92700d'];if(s>=25)return['👀','#3a4a63'];return['⏭️','#374151'];}
function activeFilters(){
  const a=[];
  if(q.value.trim())a.push('Suche „'+q.value.trim()+'“');
  if(cat.value!=='all')a.push('Kategorie');
  if(region.value!=='all')a.push('Region');
  if(typeSel.length)a.push('Arten ('+typeSel.join(', ')+')');
  if(status.value!=='all')a.push('Status');
  if(tier.value!=='all')a.push('Priorität');
  if((+ms.value||0)>0)a.push('min. Score '+(+ms.value||0));
  if(onlynew.checked)a.push('nur neue');
  if(work.value!=='open'&&work.value!=='all')a.push('Bearbeitungsstand');
  return a;
}
function resetFilters(){
  q.value='';cat.value='all';region.value='all';status.value='all';tier.value='all';
  ms.value=0;onlynew.checked=false;work.value='open';typeSel=[];
  ['q','cat','region','status','tier','onlynew','work'].forEach(k=>SV(k,k==='onlynew'?false:(k==='work'?'open':(k==='q'?'':'all'))));
  SV('minscore',0);SV('types',[]);
  typeMenu.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
  typeLabel();render();
}
function render(){
 let x=ALL.filter(d=>(d.person||'oliver')===person);
 const w=work.value;
 if(w==='open')x=x.filter(d=>jstate(d)!=='done');
 else if(w!=='all')x=x.filter(d=>jstate(d)===w);
 if(cat.value!=='all')x=x.filter(d=>(d.category||'Karriere')===cat.value);
 if(region.value!=='all')x=x.filter(d=>(d.region||'Weitere')===region.value);
 if(typeSel.length)x=x.filter(d=>{const t=(''+(d.type||'')).toLowerCase();return typeSel.some(v=>t.includes(v.toLowerCase()))});
 if(status.value!=='all')x=x.filter(d=>statusOf(d)===status.value);
 if(tier.value!=='all')x=x.filter(d=>tierOf(d)===tier.value);
 const qq=q.value.toLowerCase().trim();
 if(qq)x=x.filter(d=>(`${d.title||''} ${d.employer||''} ${d.location||''} ${d.why||''} ${(d.skills||[]).join(' ')}`).toLowerCase().includes(qq));
 let mn=+ms.value;if(!isFinite(mn)||mn<0)mn=0;if(mn>100)mn=100;
 x=x.filter(d=>(+d.score||0)>=mn);
 if(onlynew.checked)x=x.filter(isNew);
 const k=so.value;
 x.sort((a,b)=> k==='first_seen' ? (''+(b.first_seen||'')).localeCompare(''+(a.first_seen||''))
              : k==='deadline'   ? ((a.deadline||'9999').localeCompare(b.deadline||'9999'))
              : k==='employer'   ? (''+(a.employer||'')).localeCompare(''+(b.employer||''))
              : ((+b.score||0)-(+a.score||0)));
 $('resetall').hidden=activeFilters().length===0;
 const el=$('list');
 if(!x.length){
   const af=activeFilters();
   el.innerHTML='<div class=empty>'+(af.length
     ? 'Keine Treffer. Aktive Filter: <b>'+af.map(esc).join('</b>, <b>')+'</b>.<br>Oben in der Filterleiste steht „Filter zurücksetzen“.'
     : 'Für '+esc((DATA.people&&DATA.people[person]&&DATA.people[person].label)||person)+' liegen keine Einträge vor.<br>Der Scout sammelt Mo &amp; Do automatisch.')+'</div>';
   return;
 }
 el.innerHTML=x.map(d=>{
  const lb=label(d.score);const t=tierOf(d);const tm=tierMeta(t);
  const st=statusOf(d);const sm=statusMeta(st);
  const js=jstate(d);const key=esc(keyOf(d));
  const tags=[];
  if(d.type)tags.push(`<span class=tag>${esc(d.type)}</span>`);
  if(d.location)tags.push(`<span class=tag>📍 ${esc(d.location)}</span>`);
  if(d.pay)tags.push(`<span class="tag pay">💶 ${esc(d.pay)}</span>`);
  if(d.deadline)tags.push(`<span class="tag dl">⏳ Frist ${esc(d.deadline)}</span>`);
  if(d.link_code&&d.link_code!=='200'&&d.link_code!=='403')tags.push(`<span class="tag dl">⚠️ Link zuletzt ${esc(d.link_code)}</span>`);
  if(isNew(d))tags.push(`<span class="tag new">NEU</span>`);
  const skills=(d.skills&&d.skills.length)?`<div class=skills>Skills: ${d.skills.map(esc).join(' · ')}</div>`:'';
  const why=esc(d.why||'');
  const longtext=why.length>260;
  return `<div class="card${isNew(d)?' new':''}${t==='must_apply'?' must':''}${js?' st-'+js:''}">
    <div class="status ${sm[1]}">${sm[0]}</div>
    <div class=top>
      <div>
        <div class=title>${esc(d.title||'(ohne Titel)')}</div>
        <div class=emp>${esc(d.employer||'')}${d.region?` <span class="tag reg">${esc(d.region)}</span>`:''}</div>
      </div>
      <span class=badge style="background:${lb[1]}" title="${esc(tm[0])} · Score ${esc(d.score!=null?d.score:'?')} von 100">${lb[0]} ${esc(d.score!=null?d.score:'?')}</span>
    </div>
    <div>${tags.join('')}</div>
    <div class="why${longtext?' clamp':''}" data-w="${key}">${why}</div>
    ${longtext?`<button type=button class=more data-more="${key}">mehr anzeigen</button>`:''}
    ${skills}
    <div class=jbtns>
      <button type=button class="jb${js==='saved'?' on':''}" data-set=saved data-k="${key}">★ Gemerkt</button>
      <button type=button class="jb${js==='applied'?' on':''}" data-set=applied data-k="${key}">✔ Beworben</button>
      <button type=button class="jb${js==='done'?' on':''}" data-set=done data-k="${key}">✖ Erledigt</button>
    </div>
    <div class=btns>${d.url?`<a class=btn href="${esc(d.url)}" target=_blank rel=noopener>${sm[2]}</a>`:''}</div>
  </div>`;}).join('');
}
function panels(j){
 const p=$('panels');let h='';
 const sg=j.skill_gap||[];
 if(sg.length){
   const chips=sg.map(s=>{const t=typeof s==='string'?s:(s.count!=null?`${s.skill} (${s.count}${s.of?'/'+s.of:''})`:s.skill);return `<span class=chip>${esc(t)}</span>`;}).join('');
   h+=`<div class=panel><b>🧭 Skill-Gap — am häufigsten gefordert:</b><br>${chips}</div>`;
 }
 const pt=j.portfolio_tips||[];
 if(pt.length){
   h+=`<div class="panel port"><b>🚀 Portfolio-Idee der Woche:</b><br>${pt.map(esc).join('<br>')}</div>`;
 }
 p.innerHTML=h;
}
[q,cat,region,status,tier,ms,so,onlynew,work].forEach(e=>['input','change'].forEach(ev=>e.addEventListener(ev,()=>{
  SV('q',q.value);SV('cat',cat.value);SV('region',region.value);SV('status',status.value);SV('tier',tier.value);SV('work',work.value);
  SV('minscore',+ms.value||0);SV('sort',so.value);SV('onlynew',onlynew.checked);render();})));

function typeLabel(){
  typeBtn.textContent=(typeSel.length===0?'Alle Arten':(typeSel.length===1?typeSel[0]:typeSel.length+' Arten'))+' \u25BE';
  typeBtn.classList.toggle('on',typeSel.length>0);
}
typeMenu.addEventListener('change',e=>{
  if(!e.target||e.target.type!=='checkbox')return;
  typeSel=[...typeMenu.querySelectorAll('input[type=checkbox]')].filter(c=>c.checked).map(c=>c.value);
  SV('types',typeSel);typeLabel();render();
});
typeBtn.addEventListener('click',e=>{e.stopPropagation();typeMenu.hidden=!typeMenu.hidden;});
typeMenu.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>{typeMenu.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')typeMenu.hidden=true;});
$('typeclear').addEventListener('click',()=>{
  typeSel=[];typeMenu.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
  SV('types',[]);typeLabel();render();
});
typeLabel();
$('resetall').addEventListener('click',resetFilters);
$('list').addEventListener('click',e=>{
  const jb=e.target.closest('.jb'); if(jb){setState(jb.dataset.k,jb.dataset.set);return;}
  const mo=e.target.closest('.more');
  if(mo){
    const w=$('list').querySelector('.why[data-w="'+CSS.escape(mo.dataset.more)+'"]');
    if(w){const open=w.classList.toggle('clamp')===false;mo.textContent=open?'weniger anzeigen':'mehr anzeigen';}
  }
});
const CATLAB={'Karriere':'\ud83d\udcbc Karriere','Ferienjob':'\ud83d\udcb6 Ferienjob (gut bezahlt)','Beratung':'\ud83e\udd1d Beratung / Consulting'};
const REGLAB={'Norwegen / Remote':'\ud83c\uddf3\ud83c\uddf4 Norwegen / Remote','Deutschland':'\ud83c\udde9\ud83c\uddea Deutschland','Weitere':'Weitere'};
function fillSel(sel,vals,lab,key){
  const keep=sel.value;
  sel.innerHTML='<option value=all>'+(key==='cat'?'Alle Kategorien':'Alle Regionen')+'</option>'
    +vals.map(v=>'<option value="'+esc(v)+'">'+esc(lab[v]||v)+'</option>').join('');
  sel.value=vals.indexOf(keep)>=0?keep:'all';
  if(sel.value!==keep)SV(key,sel.value);
}
function buildFilters(){
  const mine=ALL.filter(d=>(d.person||'oliver')===person);
  const lab=Object.assign({},CATLAB);
  if(person==='oliver')lab['Karriere']='\ud83d\udd2d Astro/Space-Karriere';
  fillSel(cat,[...new Set(mine.map(d=>d.category||'Karriere'))].sort(),lab,'cat');
  fillSel(region,[...new Set(mine.map(d=>d.region||'Deutschland'))].sort(),REGLAB,'region');
  const arten=[...new Set(mine.map(d=>d.type).filter(Boolean))].sort();
  $('typeopts').innerHTML=arten.map(a=>'<label><input type=checkbox value="'+esc(a)+'"'
      +(typeSel.indexOf(a)>=0?' checked':'')+'> '+esc(a)+'</label>').join('');
  typeSel=typeSel.filter(v=>arten.indexOf(v)>=0);SV('types',typeSel);typeLabel();
}
function stand(v){
  const t=(''+(v||'')).replace('T',' ');
  const m=t.match(/^(\d{4})-(\d{2})-(\d{2})[ ]?(\d{2}:\d{2})?/);
  return m?`${m[3]}.${m[2]}.${m[1]}${m[4]?', '+m[4]+' Uhr':''}`:(t.slice(0,16)||'—');
}
let briefOpen=L('brief',false);
function syncTop(){
  const h=document.querySelector('header').offsetHeight;
  document.querySelector('.controls').style.top=h+'px';
}
function applyBrief(){
  const b=$('brief'),k=$('briefbtn');
  b.hidden=!briefOpen;
  k.classList.toggle('on',briefOpen);
  k.innerHTML='Lagebericht '+(briefOpen?'&#9652;':'&#9662;');
  k.setAttribute('aria-expanded',briefOpen?'true':'false');
  syncTop();
}
$('briefbtn').addEventListener('click',()=>{briefOpen=!briefOpen;SV('brief',briefOpen);applyBrief();});
window.addEventListener('resize',syncTop);
applyBrief();
function meta(){
  const ppl=DATA.people||{};const m=ppl[person]||{};
  const mine=ALL.filter(d=>(d.person||'oliver')===person);
  const nw=mine.filter(isNew).length;
  const must=mine.filter(d=>tierOf(d)==='must_apply').length;
  const upd=(DATA.updated||'').replace('T',' ').slice(0,16)||'—';
  buildFilters();
  $('title').innerHTML=TITLES[person]||'Career Scout';
  $('goal').textContent=m.goal||'';
  const app=mine.filter(d=>jstate(d)==='applied').length;
  const dn=mine.filter(d=>jstate(d)==='done').length;
  const sv=mine.filter(d=>jstate(d)==='saved').length;
  $('meta').innerHTML=`${mine.length} Chancen${must?` · <b style="color:#22c55e">${must} 🟢 Must-Apply</b>`:''}`
    +`${nw?` · <b style="color:#43d17a">${nw} neu</b>`:''}`
    +`${sv?` · ★ ${sv} gemerkt`:''}${app?` · ✔ ${app} beworben`:''}${dn?` · ✖ ${dn} erledigt`:''}`
    +` · Stand ${esc(stand(DATA.updated))}`;
  document.title=((DATA.people&&DATA.people[person]&&DATA.people[person].label)||'Career Scout').replace(/^[^A-Za-zÄÖÜ]+/,'')+' · Career Scout';
  $('summary').innerHTML=(m.phase?`<b>${esc(m.phase)}</b><br>`:'')+(m.summary?`💡 ${esc(m.summary)}`:'');
  panels(m);
  syncTop();
}
function buildPersons(){
  const ppl=DATA.people||{};const keys=Object.keys(ppl);
  if(keys.length<2){$('persons').innerHTML='';return;}
  $('persons').innerHTML=keys.map(k=>`<button type=button class="pbtn${k===person?' on':''}" data-p="${esc(k)}">${esc(ppl[k].label||k)}</button>`).join('');
  $('persons').querySelectorAll('.pbtn').forEach(b=>b.addEventListener('click',()=>{
    person=b.dataset.p;SV('person',person);
    $('persons').querySelectorAll('.pbtn').forEach(x=>x.classList.toggle('on',x.dataset.p===person));
    meta();render();
  }));
}
fetch('results.json?t='+Date.now()).then(r=>{
  if(!r.ok)throw new Error('HTTP '+r.status);
  const ct=(r.headers.get('content-type')||'');
  if(ct.indexOf('json')<0)throw new Error('AUTH');
  return r.json();
}).then(j=>{
  DATA=j;ALL=j.jobs||[];
  const ppl=j.people||{};
  if(!ppl[person])person=j.default_person||'oliver';
  buildPersons();meta();render();
}).catch(e=>{
  const auth=(''+e).indexOf('AUTH')>=0||(''+e).indexOf('SyntaxError')>=0;
  $('meta').innerHTML='';
  $('list').innerHTML='<div class=empty>'+(auth
    ? '<b>Anmeldung abgelaufen.</b><br>Bitte die Seite neu laden und dich erneut per E-Mail-Code anmelden.'
    : '<b>Daten konnten nicht geladen werden.</b><br>'+esc(''+e))+'</div>';
});
